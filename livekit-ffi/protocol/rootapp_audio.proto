// RootApp fork: all-native call audio on top of PlatformAudio.
// See RootApp.Client.Desktop/docs/native-platform-audio.md. Fork oneof cases in ffi.proto start at 1000.

syntax = "proto2";

package livekit.proto;
option csharp_namespace = "LiveKit.Proto";

// Which device a direction uses. system_default follows the OS default (the console role on Windows,
// index 0 on macOS and Linux); guid is the ADM GUID (Windows: MMDevice id; macOS: AudioObjectID as a
// decimal string); name selects by the ADM device name (Linux, where the ADM leaves GUIDs empty);
// uid is the macOS CoreAudio device UID (kAudioDevicePropertyDeviceUID), which native translates to
// the device's current AudioObjectID at every open, so it survives a replug or a coreaudiod restart.
// A uid that matches no device, and any uid on Windows or Linux, is DeviceNotFound.
message RootAudioDeviceSelection {
  oneof device {
    bool system_default = 1;
    string guid = 2;
    string name = 3;
    string uid = 4;
  }
}

// Stores the selection and applies it to the next device open. A running direction is restarted on
// the new device (stop, select, init, start as one operation on the native device thread).
// Completion arrives as RootAudioEvent.device_result with the same async_id.
message RootAudioSelectDevicesRequest {
  required uint64 platform_audio_handle = 1;
  optional RootAudioDeviceSelection recording = 2;
  optional RootAudioDeviceSelection playout = 3;
}
message RootAudioSelectDevicesResponse {
  required uint64 async_id = 1;
}

// Restarts a direction on its current selection (watchdog recovery, default device change).
message RootAudioRestartDeviceRequest {
  required uint64 platform_audio_handle = 1;
  required bool recording = 2;
  required bool playout = 3;
}
message RootAudioRestartDeviceResponse {
  required uint64 async_id = 1;
}

// Keeps platform playout running while a call holds platform audio, even with no remote stream, so
// effects play and the echo canceller keeps a continuous reference.
message RootAudioSetPlayoutHoldRequest {
  required uint64 platform_audio_handle = 1;
  required bool hold = 2;
}
message RootAudioSetPlayoutHoldResponse {
  optional string error = 1;
}

// What the native speech detector's verdict qualifies (capability SPEECH_DETECTION). The detector is
// libwebrtc's AGC2 speech detector (rnn_vad) on the APM output at 16, 32 and 48 kHz. Speech is
// confirmed after 3 frames in a row at a probability of 0.5 or more and ends 300 ms after the last
// frame at 0.3 or more. Push-to-talk, other rates and frames without a probability leave the noise
// gate exactly as with OFF. Mute does not: the detector and the speech gate keep running (warm at
// unmute), while nothing is sent and no speaking is reported.
enum RootAudioSpeechDetection {
  // The noise gate alone decides (the managed engine's behaviour).
  ROOT_AUDIO_SPEECH_DETECTION_OFF = 0;
  // The speaking state (RootAudioEvent.speaking) needs confirmed speech; the audio follows the noise
  // gate.
  ROOT_AUDIO_SPEECH_DETECTION_RING = 1;
  // As RING, and the noise gate also closes on what the detector rejects. An open it has not
  // confirmed within 200 ms of frames under 0.3, or confirmed speech whose 300 ms ran out while the
  // input still holds the gate, is released over 50 ms (40 ms at full gain, then a 10 ms ramp; about
  // 260 ms of a rejected open is sent) and held shut until a frame at 0.3 or more, an input 6 dB
  // louder than what was rejected, an onset that stays above the threshold for 30 ms, or 100 ms under
  // the threshold. When the 300 ms run out in a pause, only the gate's release is shortened to 50 ms.
  // The threshold is OFF's (automatic sensitivity follows the noise gate alone), so GATE never sends
  // more than OFF.
  ROOT_AUDIO_SPEECH_DETECTION_GATE = 2;
}

// Live control. Only the fields that are set change. Values are sanitised natively (finite, clamped).
// The response's error says "not supported by this build" when a set field has nothing to act on
// (the other fields are applied). Fields 8-14 act with the DSP chain (capability DSP; denoise_power
// and denoiser_wanted with DENOISER, speech_detection with SPEECH_DETECTION) and are only stored by
// builds without it.
message RootAudioControl {
  // Transmit gate: no audio leaves and no speaking is reported while muted. It fades over 5 ms each
  // way; mic_muted and push_to_talk of one control change together.
  optional bool mic_muted = 1;
  // 0 = voice activity (the noise gate decides), 1 = push-to-talk key held (gate forced open),
  // 2 = key up (gate closed); other values close the gate.
  optional uint32 push_to_talk = 2;
  // Linear input gain after the noise gate, 0..2 (20 ms ramp).
  optional float input_volume = 3;
  // Output volume slider value / 100 (0..2); the curve is applied natively.
  optional float master_volume = 4;
  optional bool deafened = 5;
  // Echo cancellation and WebRTC noise suppression: the host's APM policy. Each change re-initialises
  // the echo canceller, so changes are applied at most once a second and, with the DSP chain, at a
  // pause in the user's speech (at most 3 s later). Independently of webrtc_noise_suppression, native
  // turns WebRTC NS on by itself (at once, no pause or rate limit) while denoiser_wanted is set and the
  // denoiser stopped (RootAudioStats.webrtc_ns_fallback).
  optional bool echo_cancellation = 6;
  optional bool webrtc_noise_suppression = 7;
  // Effects SDK power 0..1 (0 = pass-through), applied to the installed pipeline on the next frame.
  optional float denoise_power = 8;
  // Voice gain (the app's automatic gain control). Turning it on restarts it from the last
  // gain_reset_db (0 dB before any).
  optional bool auto_gain = 9;
  // Noise gate threshold, linear RMS of a ±1 signal, 0..1 (manual sensitivity).
  optional float gate_threshold = 10;
  // The threshold follows the noise floor instead of gate_threshold.
  optional bool auto_sensitivity = 11;
  // Command: restart the voice gain from this gain in dB (0..18); every set value restarts it once.
  optional float gain_reset_db = 12;
  // The host's noise suppression mode is the Effects SDK: a stream's startup hold waits for the
  // denoiser (at most 1 s), and native WebRTC NS covers a denoiser that stops or does not arrive.
  optional bool denoiser_wanted = 13;
  // OFF until set, and again when the first platform audio handle opens and when the last one
  // closes (as the other DSP settings).
  optional RootAudioSpeechDetection speech_detection = 14;
}
message RootAudioSetControlRequest {
  required uint64 platform_audio_handle = 1;
  required RootAudioControl control = 2;
}
message RootAudioSetControlResponse {
  optional string error = 1;
}

// Per remote track volume: the app's tile volume as a linear slider value / 100 (0..2; screen audio
// defaults to 0.5), before any curve. Native plays the track at VolumeCurve(tile × master) (v^2.5,
// capped at 10, 20 ms ramps), 0 while deafened. paused silences a remote screen-audio track; an
// absent paused keeps the track's current one. Once gains are in use, a remote stream that starts
// before its gain arrives is held silent for up to 500 ms, then plays at tile 1.
message RootAudioTrackGain {
  required uint64 track_handle = 1;
  required float gain = 2;
  optional bool paused = 3;
}
message RootAudioSetTrackGainsRequest {
  required uint64 platform_audio_handle = 1;
  repeated RootAudioTrackGain gains = 2;
}
message RootAudioSetTrackGainsResponse {
  // A real failure only (the platform audio handle is gone).
  optional string error = 1;
  // Handles that are not remote audio tracks (dropped already); the other gains were applied.
  repeated uint64 unknown_track_handles = 2;
}

// Sound effects mixed into playout (and therefore into the echo canceller's reference).
// Clips are 48 kHz mono int16, copied natively and kept for the life of the factory.
message RootAudioRegisterEffectRequest {
  required uint64 platform_audio_handle = 1;
  required uint32 effect_id = 2;
  required uint64 data_ptr = 3;
  required uint32 sample_count = 4;
}
message RootAudioRegisterEffectResponse {
  optional string error = 1;
}
message RootAudioPlayEffectRequest {
  required uint64 platform_audio_handle = 1;
  required uint32 effect_id = 2;
  required float gain = 3;
}
message RootAudioPlayEffectResponse {
  optional string error = 1;
}
message RootAudioStopEffectsRequest {
  required uint64 platform_audio_handle = 1;
}
message RootAudioStopEffectsResponse {
  optional string error = 1;
}

// Effects SDK pipeline hand-off (capability DENOISER). pipeline_ptr is an audio_effects_sdk::IPipeline*
// the app created with createPipeline(pcmFloat32, sample_rate, 1 channel, pcmScale 32768) at the
// capture processor's rate (RootAudioEvent.capture_format, RootAudioStats.process_rate), with
// streaming latency, noise suppression on, its power set and the notification handler from
// livekit_ffi_rootapp_denoiser_notification_handler() installed; native never calls release().
// A pipeline is installed at a pause in the user's speech (at most 3 s after the request) and
// replaces the previous one; 0 removes the installed pipeline at once. Completion arrives as
// RootAudioEvent.denoiser_result with the async_id: on success native owns the pipeline until it
// comes back in RootAudioEvent.pipelines_returned (removed, replaced, or the last handle dropped)
// or in a ReturnPipelines response. On an error native no longer holds the pipeline, so the app
// releases it, once: the pipeline of an error result not delivered yet (and of one that failed
// with "returned before install") is also listed in the ReturnPipelines response, and a pointer
// named in both is released only once. A pipeline is never handed to native twice: results and
// returns name pipelines, not requests, so a second hand-off of the same pointer could not be told
// apart from the first (native still answers one for a pipeline it holds with a success that
// changes nothing, and never names that pipeline for it). sample_rate must be 8-48 kHz; outside
// that the request fails, unless native still holds the pipeline (a success, nothing changes).
// A pipeline whose rate is not the processor's is bypassed (RootAudioStats.denoiser_bypass_reason
// 1) until the processor runs at its rate again or a pipeline at the processor's rate is installed.
message RootAudioSetDenoiserRequest {
  required uint64 platform_audio_handle = 1;
  required uint64 pipeline_ptr = 2;
  required uint32 sample_rate = 3;
}
message RootAudioSetDenoiserResponse {
  required uint64 async_id = 1;
}
// Returns every pipeline native holds, installed or waiting to be, and every pipeline native let go
// of that no event has named yet (returned ones, and those of error results not delivered yet) (app
// exit, before the SDK factory's waitUntilAsyncWorkFinished). Synchronous; waits up to 200 ms in all
// for a change in progress and the audio thread to let go of the installed one (on a timeout it
// stays installed and error says so). Requests still waiting complete with the error "returned
// before install". Without an error, native holds no pipeline handed over before the request, and
// no later event names one, except for pipelines_returned events already on their way to the app
// (it ignores names it released). Later SetDenoiser requests work.
message RootAudioReturnPipelinesRequest {
  required uint64 platform_audio_handle = 1;
}
message RootAudioReturnPipelinesResponse {
  repeated uint64 pipelines = 1;
  optional string error = 2;
}

// Mic test (capability MONITOR): enabled opens the selected devices for the app (released again by
// enabled=false unless a call holds them) and plays the processed capture (what a call would send:
// a multi-channel mic averaged to mono, following mute, push-to-talk, the gate and the input volume)
// on the playout device, outside the echo canceller's reference. Refused with an error while a call
// sends from the platform microphone; a call that starts sending turns the monitor off
// (RootAudioStats.monitor_active false).
message RootAudioSetMonitorRequest {
  required uint64 platform_audio_handle = 1;
  required bool enabled = 2;
}
message RootAudioSetMonitorResponse {
  optional string error = 1;
}

// Counters are cumulative for the life of the native audio engine (the factory's ADM, mixer, APM and
// capture state, shared by every PlatformAudio handle and kept across handles and calls; the reader
// takes deltas from its own baseline per call). Levels are sums of squares in int16 units with their
// sample counts. Durations are microseconds. The *_max_gap_us and *_max_us fields are the maximum
// since the previous RootAudioStatsRequest (reset on read: one reader, the app's 100 ms voice
// sampler).
message RootAudioStats {
  // Device IO (AdmProxy transport tap).
  required uint64 capture_callbacks = 1;
  required uint64 render_callbacks = 2;
  required uint64 capture_max_gap_us = 3;
  required uint64 render_max_gap_us = 4;
  required uint64 last_capture_age_us = 5;
  required uint64 last_render_age_us = 6;
  required bool recording = 7;
  required bool playing = 8;
  required int32 recording_init_result = 9;
  required int32 recording_start_result = 10;
  required int32 playout_init_result = 11;
  required int32 playout_start_result = 12;
  required uint32 capture_rate = 13;
  required uint32 capture_channels = 14;
  required double capture_raw_sumsq = 15;
  required uint64 capture_raw_samples = 16;
  required uint32 playout_delay_ms = 17;
  required uint32 recording_delay_ms = 18;

  // Mixer.
  required uint64 mix_calls = 20;
  required uint64 mix_max_gap_us = 21;
  required uint32 mix_sources = 22;
  repeated uint32 mix_ssrcs = 23;
  required double mix_out_sumsq = 24;
  required uint64 mix_out_samples = 25;
  required uint64 effects_played = 26;
  required uint64 effects_dropped = 27;

  // Capture processing (zero until the processor runs). Stage levels are channel 0 of every processed
  // frame: the APM output, after the denoiser (and its aligner), the noise gate's input (after the
  // voice gain and the startup hold) and what is sent; stage_samples counts the samples behind each.
  // denoised_sumsq, gate_in_sumsq, fields 38-45 and 74-83 come from the DSP chain (capability DSP);
  // without it they stay 0, false, or NaN for dB values.
  required uint64 processed_frames = 30;
  required uint32 process_rate = 31;
  required uint32 process_channels = 32;
  required double apm_out_sumsq = 33;
  required double denoised_sumsq = 34;
  required double gate_in_sumsq = 35;
  required double sent_sumsq = 36;
  required uint64 stage_samples = 37;
  // Loudest gate block (about 2.7 ms) at the gate input since the previous read, dBFS of a ±1 signal
  // (reset on read; -inf when every block was silent, NaN before any frame).
  required float gate_in_block_peak_db = 38;
  // The gate's threshold on the last frame (linear RMS of a ±1 signal; the automatic one in auto mode).
  required float threshold = 39;
  // Highest gate envelope (0..1) since the previous read (reset on read).
  required float envelope = 40;
  // The noise gate's own speaking state on the last frame (envelope plus its 300 ms hold), muted or not.
  required bool gate_speaking = 41;
  // Transitions of `speaking` (the value RootAudioEvent.speaking reports).
  required uint64 speaking_seq = 42;
  // The voice gain on the last frame, and whether it heard enough speech to be remembered.
  required float voice_gain_db = 43;
  required bool voice_gain_settled = 44;
  // Frames that ended with the gate envelope above 0.
  required uint64 gate_open_frames = 45;

  // Denoiser (capability DENOISER). denoiser_frames counts process() calls; denoiser_misses frames
  // the slot was busy (installing or removing) and passed dry; denoiser_slow_frames process() calls
  // over 5 ms; denoiser_notifications the SDK's slowProcessing notifications through the native
  // handler (process-wide, cumulative). denoiser_bypass_reason: 0 none, 1 rate mismatch (until the
  // processor's rate matches the pipeline again, or a pipeline at its rate is installed), 2 output
  // stalled (100 empty outputs in a row), 3 slow (3 calls over 5 ms within 60 s, or one over 20 ms,
  // counting only plain calls: not the first after an install, a flush or a stream restart, nor one
  // with a power change); 2 and 3 last until the pipeline is replaced or removed. A call's time
  // includes the flush and power change made with it (denoiser_slow_frames, the maximum and the
  // histogram count every call).
  required bool denoiser_installed = 50;
  required uint64 denoiser_frames = 51;
  required uint64 denoiser_misses = 52;
  required uint64 denoiser_empty_outputs = 53;
  required uint64 denoiser_process_max_us = 54;
  required uint64 denoiser_slow_frames = 55;
  required uint32 denoiser_bypass_reason = 56;
  required uint64 denoiser_notifications = 57;

  // Echo canceller (APM statistics; NaN when unknown, and aec_delay_ms -1). Until the APM decorator
  // (APM_DECORATOR) the two flags are what the newest device track asked of the APM.
  required double erl_db = 60;
  required double erle_db = 61;
  required int32 aec_delay_ms = 62;
  required double divergent_filter_fraction = 63;
  required bool echo_cancellation_active = 64;
  required bool webrtc_ns_active = 65;

  // Real-time rule checks; absent from builds that predate them. Locks taken and libwebrtc log
  // lines raised (dropped) on device threads; device callbacks and mixes that found another one
  // in flight (a device thread the ADM failed to stop) and got silence; device stops that failed.
  optional uint64 audio_thread_lock_violations = 70;
  optional uint64 audio_thread_logs_dropped = 71;
  optional uint64 overlapping_callbacks = 72;
  optional uint64 device_stop_failures = 73;

  // DSP chain (capability DSP; absent from builds without it).
  // What RootAudioEvent.speaking reports, on the last frame: gate_speaking while the transmit gate is
  // open (not muted, push-to-talk key not up), and with speech detection judging the frame also
  // `speech`.
  optional bool speaking = 74;
  // Frames whose gate input RMS was above the threshold (the input duty cycle).
  optional uint64 gate_input_above_frames = 75;
  // Frames the startup hold silenced: a stream's first 20, and while denoiser_wanted up to its 100th
  // until the denoiser runs.
  optional uint64 startup_hold_frames = 76;
  // Frames that left with the transmit gate open (any part of them).
  optional uint64 transmit_frames = 77;
  // Frames the chain could not process (rate outside 8-48 kHz or not rate/100 samples): only the
  // transmit gate applied.
  optional uint64 unsupported_frames = 78;
  // Non-finite samples (NaN, ±Inf) in the APM output or the denoiser output, replaced by 0.
  optional uint64 non_finite_samples = 79;
  // Session starts (everything per stream starts over) and stream (re)starts (recording started,
  // or the processing rate changed: the denoiser, its aligner and the startup hold start over).
  optional uint64 dsp_resets = 80;
  optional uint64 dsp_flushes = 81;
  // The last time the transmit gate went from closed to open (unmute, push-to-talk press): from the
  // control reaching native to the first frame processed with it open; 0 before any.
  optional uint64 gate_open_delay_us = 82;
  // Frames sent with the transmit gate open while denoiser_wanted was set but neither the denoiser
  // ran nor WebRTC NS was applied (startup hold excluded): a gap in noise suppression. This includes
  // the designed ones: the grace for a missing denoiser (webrtc_ns_fallback) and the fallback's way
  // to the APM (ns_fallback_pending_frames).
  optional uint64 ns_gap_frames = 83;

  // Denoiser details (capability DENOISER; absent without it).
  // The installed pipeline's rate (0 none), pipelines installed so far, and frames passed dry
  // because the installed pipeline is bypassed.
  optional uint32 denoiser_rate = 84;
  optional uint64 denoiser_installs = 85;
  optional uint64 denoiser_bypassed_frames = 86;
  // Cumulative histogram of process() durations: 16 buckets with upper bounds 50, 100, 150, 200,
  // 300, 400, 500, 750, 1000, 1500, 2000, 3000, 5000, 10000, 20000 µs and the rest.
  repeated uint64 denoiser_process_us_buckets = 87;
  // Notifications with a code other than slowProcessing.
  optional uint64 denoiser_other_notifications = 88;
  // The aligner (DenoiseFrameAligner) on the last frame: the latency it adds (inserted minus drained
  // and trimmed since it last started over: a new pipeline, a flush or stream restart, a rate change,
  // a session reset, or the denoiser out of use; the app's managed denoiser counted from its own
  // creation, which only differs after such a restart) and the samples it holds. Its underruns and
  // padded, trimmed and drained samples are cumulative for the engine's life like every counter here
  // (across sessions and restarts).
  optional float denoiser_latency_ms = 89;
  optional uint32 denoiser_buffered_samples = 90;
  optional uint64 denoiser_underruns = 91;
  optional uint64 denoiser_padded_samples = 92;
  optional uint64 denoiser_trimmed_samples = 93;
  optional uint64 denoiser_drained_samples = 94;
  // process() calls of the installed pipeline before its first output (-1 none yet or no pipeline).
  optional int32 denoiser_frames_until_first_output = 95;
  // Native turned WebRTC NS on because denoiser_wanted is set and the denoiser stopped (output
  // stalled or slow: at once) or is missing, bypassed for its rate or removed for over 1 s of frames
  // (not counting the time a handed-over pipeline waits for a pause in speech, at most 3 s).
  optional bool webrtc_ns_fallback = 96;

  // APM policy (echo cancellation and WebRTC NS changes): applications that reached the APM, those
  // that waited for a pause in speech, those made at the 3 s limit while the user spoke, and whether
  // a change is waiting now (rate limit or speech).
  optional uint64 apm_policy_applies = 97;
  optional uint64 apm_policy_deferred = 98;
  optional uint64 apm_policy_forced = 99;
  optional bool apm_policy_pending = 100;

  // Frames processed while native had decided on its WebRTC NS fallback but the APM had not applied
  // NS yet (capability DENOISER; absent without it): the fallback's own way to the APM, part of
  // ns_gap_frames when it happens while denoiser_wanted is set and the transmit gate is open.
  optional uint64 ns_fallback_pending_frames = 101;

  // Mic test monitor (capability MONITOR; absent without it). monitor_active: the monitor is on and
  // the processed capture is played locally (false after SetMonitor(false), and when native turned it
  // off because a call started sending). monitor_frames counts 10 ms render frames that played monitor
  // audio; monitor_dropped_frames counts 10 ms frames lost to the monitor's ring: render frames that
  // ran out of audio while playing (underruns), frames skipped to bring a latency that grew back down,
  // and capture frames that found the ring full while the render side ran. Priming and frames that went
  // stale across a device stop or start or a render stall are not counted.
  optional bool monitor_active = 102;
  optional uint64 monitor_frames = 103;
  optional uint64 monitor_dropped_frames = 104;

  // Per-source playout levels (absent from builds without them). mix_source_levels_counted says the
  // build counts them, so an empty list then means no remote stream reaches the mixer.
  repeated RootAudioSourceLevel mix_source_levels = 105;
  optional bool mix_source_levels_counted = 106;

  // Speech detector (capability SPEECH_DETECTION; absent without it). speech_detection is the
  // setting native applies. speech_probability is the highest probability the detector gave since
  // the previous read (reset on read; -1 when it judged no frame since: detection off or a rate it
  // does not run at). speech_detector_running: the speech gate judged the last frame (detection on,
  // a probability, push-to-talk not in use). speech: it had confirmed speech on the last frame
  // (muted or not). speech_frames counts frames with confirmed speech; speech_closed_frames frames
  // in which the speech gate kept the noise gate from opening or forced it to close (GATE only);
  // speech_unavailable_frames frames with detection on but no probability.
  optional RootAudioSpeechDetection speech_detection = 107;
  optional float speech_probability = 108;
  optional bool speech_detector_running = 109;
  optional bool speech = 110;
  optional uint64 speech_frames = 111;
  optional uint64 speech_closed_frames = 112;
  optional uint64 speech_unavailable_frames = 113;
}
// One playout mixer source (a remote audio stream): its audio as it reached the mixer, decoded and
// before its gain (tile volume, master volume, deafen; a muted frame counts as silence), as a sum of
// squares in int16 units over `samples`, cumulative since the source was added. source_id tells a
// stream added again under the same SSRC from the earlier one (its counts start over).
// track_handles are the remote audio tracks livekit_ffi knows under that SSRC (the SSRCs it resolves
// for track gains and at subscribe); empty while none is resolved.
message RootAudioSourceLevel {
  optional uint32 ssrc = 1;
  optional uint64 source_id = 2;
  optional double sumsq = 3;
  optional uint64 samples = 4;
  repeated uint64 track_handles = 5;
}
message RootAudioStatsRequest {
  required uint64 platform_audio_handle = 1;
}
message RootAudioStatsResponse {
  optional RootAudioStats stats = 1;
  optional string error = 2;
}

// The local user's speaking state (capability DSP): the noise gate's speaking while the transmit gate
// is open (with speech detection RING or GATE, and push-to-talk not in use, also only while the
// detector confirms speech). Sent when it differs from the last value sent to this handle (polled every 10 ms, so
// transitions shorter than that are merged); seq is RootAudioStats.speaking_seq at that time.
message RootAudioSpeaking {
  required bool speaking = 1;
  required uint64 seq = 2;
}
// Sent about 100 ms after the handle is created when the capture processor has run before, and on
// every change. An event sent before the host listens is lost, so a host also reads
// RootAudioStats.process_rate / process_channels once it does.
message RootAudioCaptureFormat {
  required uint32 sample_rate = 1;
  required uint32 channels = 2;
}
// Pipelines native no longer holds, for the app to release, each sent once: to the handle that set
// it while that handle lives, else to the newest live handle. One sent just before a ReturnPipelines
// response can reach the app after it (the response does not list it, and the app released it as
// still out): the app ignores a name it already released or never sent.
message RootAudioPipelinesReturned {
  repeated uint64 pipelines = 1;
}
message RootAudioDeviceResult {
  required uint64 async_id = 1;
  optional string recording_error = 2;
  optional string playout_error = 3;
}
message RootAudioDenoiserResult {
  required uint64 async_id = 1;
  optional string error = 2;
}
// The denoiser slot's state (capability DENOISER), sent when any field changes and about 100 ms after
// the handle is created. bypass_reason as RootAudioStats.denoiser_bypass_reason.
message RootAudioDenoiserState {
  required bool installed = 1;
  required uint32 rate = 2;
  required uint32 bypass_reason = 3;
  required bool webrtc_ns_fallback = 4;
}

message RootAudioEvent {
  required uint64 platform_audio_handle = 1;
  oneof message {
    RootAudioSpeaking speaking = 2;
    RootAudioCaptureFormat capture_format = 3;
    RootAudioPipelinesReturned pipelines_returned = 4;
    RootAudioDeviceResult device_result = 5;
    RootAudioDenoiserResult denoiser_result = 6;
    RootAudioDenoiserState denoiser_state = 7;
  }
}

// Screen-share audio captured natively (capability SCREEN_AUDIO). The OS captures what the machine
// plays (Windows: WASAPI process loopback; macOS: ScreenCaptureKit; Linux: PipeWire) and native code
// paces it at 10 ms into an AudioSource the host created and publishes as before, so no host thread
// is on the audio path. While a capture is attached the source sends only what the capture gives it
// (silence while it waits for audio, restarts or after a stop) and refuses CaptureAudioFrame. The
// source's format and the published track never change: an OS capture that fails or restarts leaves
// silence in the same stream (never stop, restart or retarget a published audio sender in place).
// Independent of PlatformAudio: it works with the platform and the host-driven call audio alike.

// What to capture. Absent or `system`: everything the machine plays except this process and its
// children (the call's own playout, so remote voices are never sent back).
message RootScreenAudioTarget {
  oneof target {
    bool system = 1;
    // Only this process and its children (Windows). macOS: the application with this pid. Linux:
    // system. A process that cannot be found, or this process itself: system.
    uint32 process_id = 2;
    // Only the application owning this window: HWND (Windows: its process tree), CGWindowID (macOS:
    // its application, window_title as a second lookup, exact then case-insensitive). Linux: system.
    // A window that cannot be found: system.
    uint64 window_id = 3;
  }
  optional string window_title = 4;
}

// What a started capture captures (RootScreenAudioStarted.scope, RootScreenAudioStats.scope).
enum RootScreenAudioScope {
  ROOT_SCREEN_AUDIO_SCOPE_SYSTEM = 0;
  ROOT_SCREEN_AUDIO_SCOPE_PROCESS = 1;
  ROOT_SCREEN_AUDIO_SCOPE_APPLICATION = 2;
}

enum RootScreenAudioError {
  ROOT_SCREEN_AUDIO_ERROR_NONE = 0;
  // No backend in this build, OS too old (Windows before 10.0.20348, macOS before 13), API missing.
  ROOT_SCREEN_AUDIO_ERROR_UNSUPPORTED = 1;
  // macOS Screen Recording not granted; Linux PipeWire access refused.
  ROOT_SCREEN_AUDIO_ERROR_PERMISSION_DENIED = 2;
  // The OS refused to open the capture.
  ROOT_SCREEN_AUDIO_ERROR_START_FAILED = 3;
  // The capture endpoint went away (device invalidated, audio service or daemon restarted).
  ROOT_SCREEN_AUDIO_ERROR_DEVICE_LOST = 4;
  // Any other failure of a running capture.
  ROOT_SCREEN_AUDIO_ERROR_STREAM_FAILED = 5;
  // The captured process or application exited.
  ROOT_SCREEN_AUDIO_ERROR_TARGET_GONE = 6;
  ROOT_SCREEN_AUDIO_ERROR_TIMEOUT = 7;
  ROOT_SCREEN_AUDIO_ERROR_INTERNAL = 8;
}

enum RootScreenAudioState {
  // A start (or the first one) is running.
  ROOT_SCREEN_AUDIO_STATE_STARTING = 0;
  // The OS capture runs; the stream sends silence until enough audio is queued (and again after it
  // ran dry).
  ROOT_SCREEN_AUDIO_STATE_WAITING = 1;
  ROOT_SCREEN_AUDIO_STATE_RUNNING = 2;
  // The OS capture failed and native restarts it (backoff 0.2, 1, 3, 3, 3 s; at most 5 per minute).
  ROOT_SCREEN_AUDIO_STATE_RESTARTING = 3;
  // The start failed, or a running capture failed for good; the stream stays silent.
  ROOT_SCREEN_AUDIO_STATE_FAILED = 4;
  ROOT_SCREEN_AUDIO_STATE_STOPPED = 5;
}

// Attaches a capture to source_handle, an AudioSource of type NATIVE at 48 kHz with 1 or 2 channels
// and a queue (queue_size_ms above 0), and starts it on the capture's own native thread. A refused
// request (no SCREEN_AUDIO in this build, an unknown or unusable source, a source that already has a
// capture) sets error and makes no capture. Otherwise capture_handle is an owned handle: dropping it
// (FfiDropHandle) detaches the capture from the source at once and stops the OS capture on the
// capture's thread, so the drop never blocks. The start completes with RootScreenAudioEvent.started
// or .failed carrying async_id.
message RootScreenAudioStartRequest {
  required uint64 source_handle = 1;
  optional RootScreenAudioTarget target = 2;
}
message RootScreenAudioStartResponse {
  optional uint64 capture_handle = 1;
  optional uint64 async_id = 2;
  optional string error = 3;
}

// Stops the OS capture (the source sends silence until the handle is dropped); completes with
// RootScreenAudioEvent.stopped carrying async_id, after which no OS capture runs.
message RootScreenAudioStopRequest {
  required uint64 capture_handle = 1;
}
message RootScreenAudioStopResponse {
  optional uint64 async_id = 1;
  optional string error = 2;
}

// Counters are cumulative for the capture; the *_max_* fields are maxima since the previous
// RootScreenAudioStatsRequest (reset on read: one reader). Frames are per channel; "48 kHz frames"
// are after native's conversion to the source's rate.
message RootScreenAudioStats {
  required RootScreenAudioState state = 1;
  required RootScreenAudioScope scope = 2;
  // The OS capture's format (0 before the first start).
  required uint32 capture_rate = 3;
  required uint32 capture_channels = 4;
  // OS side: frames delivered (at capture_rate), of those flagged silent by the OS, OS-reported lost
  // audio (WASAPI data discontinuity, a PipeWire xrun), 48 kHz frames dropped because the ring was
  // full, the longest wait between two deliveries (µs, reset on read), and deliveries after a wait of
  // 60 ms or more (or twice the largest delivery, at most 500 ms).
  required uint64 captured_frames = 5;
  required uint64 silent_capture_frames = 6;
  required uint64 discontinuities = 7;
  required uint64 overflow_frames = 8;
  required uint64 write_max_gap_us = 9;
  required uint64 capture_stalls = 10;
  // Source side (the 10 ms pulls): pulls, the longest wait between two (µs, reset on read), 48 kHz
  // frames of captured audio sent and of silence sent (waiting, gaps, stopped), times the queue ran
  // dry, those of them that a capture pause caused (gaps; the others were late deliveries and raised
  // the target by 10 ms), frames spliced out to bring the latency down, frames of a backlog skipped
  // when sending (re)started, and samples clipped to full scale.
  required uint64 pulls = 11;
  required uint64 pull_max_gap_us = 12;
  required uint64 sent_frames = 13;
  required uint64 silence_frames = 14;
  required uint64 underruns = 15;
  required uint64 gaps = 16;
  required uint64 trimmed_frames = 17;
  required uint64 skipped_frames = 18;
  required uint64 clipped_samples = 19;
  // Level of the captured audio sent: sum of squares in int16 units over sent_samples.
  required double sent_sumsq = 20;
  required uint64 sent_samples = 21;
  // The queue: its smoothed lowest level after a pull (-1 before the first measurement) and the
  // margin native holds it at (20 ms, raised by late deliveries up to 200 ms), in ms; the clock-drift
  // rate correction now, in ppm (positive: the capture runs fast).
  required float level_ms = 22;
  required float target_ms = 23;
  required int32 drift_ppm = 24;
  // OS capture restarts that succeeded, and the last failure (NONE before any).
  required uint32 restarts = 25;
  required RootScreenAudioError last_error = 26;
  optional string last_error_message = 27;
}
message RootScreenAudioStatsRequest {
  required uint64 capture_handle = 1;
}
message RootScreenAudioStatsResponse {
  optional RootScreenAudioStats stats = 1;
  optional string error = 2;
}

// The OS capture runs. async_id is the start request's, 0 for a restart after a failure. description
// says what it captures, e.g. "process 1234 (chrome.exe) and its children" or "window not found; all
// audio except process 5678 and its children". sample_rate and channels are the OS capture's (native
// converts to the source's format).
message RootScreenAudioStarted {
  required uint64 async_id = 1;
  required RootScreenAudioScope scope = 2;
  required string description = 3;
  required uint32 sample_rate = 4;
  required uint32 channels = 5;
}
// A start failed (async_id the start request's) or a running capture failed (async_id 0). retrying:
// native restarts it; false: it gave up and the stream stays silent until the handle is dropped.
message RootScreenAudioFailed {
  required uint64 async_id = 1;
  required RootScreenAudioError error = 2;
  required string message = 3;
  required bool retrying = 4;
}
message RootScreenAudioStopped {
  required uint64 async_id = 1;
}
// Events of one capture, polled every 20 ms while its handle lives (none after the drop).
message RootScreenAudioEvent {
  required uint64 capture_handle = 1;
  oneof message {
    RootScreenAudioStarted started = 2;
    RootScreenAudioFailed failed = 3;
    RootScreenAudioStopped stopped = 4;
  }
}
